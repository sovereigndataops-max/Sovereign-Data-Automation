name: Personal Assistant v0.1 Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
       
    

      - name: Check Python syntax
        run: python -m py_compile Assistant.py
      - name: Test Assistant Startup
        run: printf '1\nTest Project\nTesting memeory\n7\nTest Project\n0\n' | python Assistant.py
      - name: Restart and check saved memory
        run: printf '7\nTest Project\n0\n' | python Assistant.py
        
      - name: Test Assistant Startup
        run: printf '1\nTest Project\nTesting memory\n8\n0\n' | python  Assistant.py

      - name: Test Task Completion
        run: printf '4\n1\nReviewTest\n5\n1\n1\n8\n1\n0\n' | python Assistant.py
      - name: Test Decision History
        run: printf '3\n1\nOriginal Test Decision\n\n\nAPPROVE\n6\n1\n1\nUpdated Test Decision\n\nAPPROVE\n8\n1\n0\n' | python Assistant.py
       
