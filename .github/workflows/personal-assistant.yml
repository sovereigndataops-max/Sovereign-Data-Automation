name: Personal Assistant v0.1 Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m py_compile Assistant.py
      - name: Test Assistant Startup
        run: printf '0\n' | python  Assistant.py

