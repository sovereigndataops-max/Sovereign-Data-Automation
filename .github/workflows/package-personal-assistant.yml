name: Package Personal Assistant v0.1

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Windows executable
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --console --name PersonalAssistant windows_launcher.py
      - name: Smoke-test executable and customer data location
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item dist/PersonalAssistant.exe smoke/
          '0' | & ./smoke/PersonalAssistant.exe
          if ($LASTEXITCODE -ne 0) { throw 'Executable failed' }
          if (!(Test-Path smoke/assistant.db)) { throw 'Customer database not created next to executable' }
          Remove-Item smoke/assistant.db
      - name: Prepare Windows customer ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path customer-windows | Out-Null
          Copy-Item dist/PersonalAssistant.exe customer-windows/
          Copy-Item CUSTOMER_INSTRUCTIONS_WINDOWS.txt customer-windows/
          Compress-Archive -Path customer-windows/* -DestinationPath PersonalAssistant-v0.1-Windows.zip
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAssistant-v0.1-Windows
          path: PersonalAssistant-v0.1-Windows.zip

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python source
        run: python -m py_compile Assistant.py
      - name: Prepare Python customer ZIP
        run: |
          mkdir -p customer-python
          cp Assistant.py CUSTOMER_INSTRUCTIONS_PYTHON.txt customer-python/
          cd customer-python
          zip ../PersonalAssistant-v0.1-Python.zip Assistant.py CUSTOMER_INSTRUCTIONS_PYTHON.txt
      - name: Upload Python ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAssistant-v0.1-Python
          path: PersonalAssistant-v0.1-Python.zip
