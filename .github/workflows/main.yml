name: Build App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev libncurses6:i386 libstdc++6:i386 zlib1g:i386

  
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required build tools
        run: |
    sdkmanager "build-tools;33.0.2" "platforms;android-33"
      - name: Install Python deps
        run: |
          pip install --upgrade pip cython buildozer

      - name: Build APK
        env:
          ANDROIDSDK: $HOME/android-sdk
          ANDROIDNDK: $HOME/android-sdk/ndk/25.2.9519653
        run: |
          buildozer android debug


